<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
</head>
<body>
  <h1 style="text-align:center;">Nick Vujicic Blog</h1>
  <div style="width: 400px; margin: auto;">
    <form action="login.html" method="post">
      <label><strong>Name:</strong></label><br>
      <input type="text" required><br><br>

      <label><strong>Email:</strong></label><br>
      <input type="email" required><br><br>

      <label><strong>Password:</strong></label><br>
      <input type="password" required><br><br>

      <label><strong>Confirm Password:</strong></label><br>
      <input type="password" required><br><br>

      <label><strong>Mobile No:</strong></label><br>
      <input type="tel" required><br><br>

      <label><strong>Date of Birth:</strong></label><br>
      <input type="date" required><br><br>

      <label><strong>Gender</strong></label><br>
      <input type="radio" id="male" name="gender" value="Male">
      <label for="male">Male</label>
  
      <input type="radio" id="female" name="gender" value="Female">
      <label for="female">Female</label><br><br>

      <label><strong>Address:</strong></label><br>
      <textarea rows="3" cols="35" required></textarea><br><br>

      <input type="submit" value="Submit">
    </form>
  </div>
</body>
</html>
