<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nick Vujicic Gallery</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-image: url("images/nature3.jpg");
    }

    header {
      background-color: #333;
      color: white;
      padding: 1rem 2rem;
      text-align: center;
    }

    h2 {
      margin-top: 1.5rem;
      text-align: center;
      color: #f2ff3b;
    }

    p {
      text-align: center;
      color:#f2ff3b;
      margin-bottom: 2rem;
    }
  .gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    padding: 20px;
  }

  .gallery img {
    width: 250px;
    height: 300px;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: transform 0.2s ease-in-out;
  }

  .gallery img:nth-child(1),
  .gallery img:nth-child(4),
  .gallery img:nth-child(10),
  .gallery img:nth-child(14),
  .gallery img:nth-child(18),
  .gallery img:nth-child(19) {
    width: 400px;
  }
</style>


  </style>
</head>
<body>

  <header>
    <h1>Nick Vujicic Blog</h1>
  </header>

  <h2 id="gallery">Gallery</h2>
  <p>Below are glimpses of Nick Vujicic’s life journey:</p>

  <div class="gallery">
    <!-- Image placeholders 1 to 20 -->
    <img src="images/1.jpeg" alt="Nick 1">
    <img src="images/2.jpeg" alt="Nick 2">
    <img src="images/3.jpg" alt="Nick 3">
    <img src="images/4.jpg" alt="Nick 4">
    <img src="images/5.jpeg" alt="Nick 5">
    <img src="images/6.jpg" alt="Nick 6">
    <img src="images/7.jpeg" alt="Nick 7">
    <img src="images/8.jpg" alt="Nick 8">
    <img src="images/9.jpg" alt="Nick 9">
    <img src="images/10.jpeg" alt="Nick 10">
    <img src="images/11.jpg" alt="Nick 11">
    <img src="images/12.png" alt="Nick 12">
    <img src="images/13.jpg" alt="Nick 13">
    <img src="images/14.jpeg" alt="Nick 14">
    <img src="images/15.jpg" alt="Nick 15">
    <img src="images/16.jpg" alt="Nick 16">
    <img src="images/17.jpg" alt="Nick 17">
    <img src="images/18.jpeg" alt="Nick 18">
    <img src="images/19.jpeg" alt="Nick 19">
    <img src="images/20.jpeg" alt="Nick 20">
  </div>

</body>
</html>
